name: Healthcare Intelligence Data Pipeline

# Monthly (was quarterly until 2026-09-25) - see
# docs/cms-intelligence/COST_AND_OPERATING_MODEL.md's revised cadence
# section. Pulling public data is free (plain HTTP, no LLM call), so there's
# no cost reason to wait a quarter; sources that publish slower than
# monthly just produce an unchanged snapshot. Separate from - and
# independent of - pipeline/'s weekly cms-pipeline.yml (Track C v1), which
# stays untouched per docs/cms-intelligence/PROJECT_BOUNDARY.md.
#
# This workflow never sets an API key and never triggers LLM reasoning,
# only data collection.
on:
  schedule:
    - cron: "0 13 1 * *" # 13:00 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pull-datasets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Pull CMS Home Health Care Agencies
        run: npx tsx cms-intelligence/data/adapters/pull-home-health.ts

      - name: Pull CMS Medicare Physician & Other Practitioners
        run: npx tsx cms-intelligence/data/adapters/pull-physician-other-practitioners.ts

      - name: Pull Federal Register CMS documents
        run: npx tsx cms-intelligence/data/adapters/pull-federal-register.ts

      - name: Pull CMS MA/Part D Monthly Enrollment by Plan
        run: npx tsx cms-intelligence/data/adapters/pull-ma-part-d.ts

      - name: Pull CMS Marketplace Rate PUF
        run: npx tsx cms-intelligence/data/adapters/pull-marketplace-rate-puf.ts

      - name: Pull SEC EDGAR 8-K filings (health-insurer watchlist)
        run: npx tsx cms-intelligence/data/adapters/pull-sec-edgar-filings.ts

      - name: Pull openFDA novel drug approvals
        run: npx tsx cms-intelligence/data/adapters/pull-fda-drug-approvals.ts

      - name: Pull NIH RePORTER award notices
        run: npx tsx cms-intelligence/data/adapters/pull-nih-reporter-awards.ts

      - name: Pull ClinicalTrials.gov Phase 3 results postings
        run: npx tsx cms-intelligence/data/adapters/pull-clinicaltrials-results.ts

      - name: Commit updated snapshot
        run: |
          git config user.name "healthcare-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/healthcare-intelligence
          git diff --cached --quiet || git commit -m "chore: quarterly healthcare-intelligence data pull $(date -u +%Y-%m-%d)"
          git push
