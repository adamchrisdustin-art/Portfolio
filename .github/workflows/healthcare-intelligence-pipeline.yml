name: Healthcare Intelligence Data Pipeline

# Monthly (was quarterly until 2026-09-25) - see
# docs/cms-intelligence/COST_AND_OPERATING_MODEL.md's revised cadence
# section. Pulling public data is free (plain HTTP, no LLM call), so there's
# no cost reason to wait a quarter; sources that publish slower than
# monthly just produce an unchanged snapshot. Separate from - and
# independent of - pipeline/'s weekly cms-pipeline.yml (Track C v1), which
# stays untouched per docs/cms-intelligence/PROJECT_BOUNDARY.md.
#
# After the pull, the autonomous reasoning step (added 2026-09-25) re-runs
# every agent with a real model and an executive-analyst pass, then the
# result is committed straight to main and Vercel deploys it - no human
# review, per Adam's decision; cms-intelligence/reasoning/grounding.ts is
# the safety net. It spends nothing when no source's content changed, and
# nothing at all if the API-key secrets aren't set. Which model does
# which job: repo variables SALIENCE_MODEL / ANALYST_MODEL (optional,
# "provider:model"), else the defaults in run-monthly-reasoning.ts.
on:
  schedule:
    - cron: "0 13 1 * *" # 13:00 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pull-datasets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Pull CMS Home Health Care Agencies
        run: npx tsx cms-intelligence/data/adapters/pull-home-health.ts

      - name: Summarize CMS Medicare Physician & Other Practitioners (every provider, new data years only)
        # Past data years are already committed; this only pulls a year CMS has newly published (~5 min each).
        run: npx tsx cms-intelligence/data/adapters/pull-physician-by-provider-summary.ts

      - name: Summarize CMS Medicare Physician & Other Practitioners by service (national, new data years only)
        run: npx tsx cms-intelligence/data/adapters/pull-physician-service-summary.ts

      - name: Pull Federal Register CMS documents
        run: npx tsx cms-intelligence/data/adapters/pull-federal-register.ts

      - name: Pull CMS MA/Part D Monthly Enrollment by Plan
        run: npx tsx cms-intelligence/data/adapters/pull-ma-part-d.ts

      - name: Summarize CMS Marketplace Rate + Plan Attributes PUFs (every HealthCare.gov state; newest plan year re-checked, older years kept)
        run: npx tsx cms-intelligence/data/adapters/pull-marketplace-rate-puf.ts

      - name: Pull CMS Marketplace Open Enrollment state-level PUFs (every state and DC)
        run: npx tsx cms-intelligence/data/adapters/pull-marketplace-enrollment.ts
      - name: Pull State Medicaid and CHIP monthly enrollment (every state and DC, data.medicaid.gov)
        run: npx tsx cms-intelligence/data/adapters/pull-medicaid-enrollment.ts
      - name: Pull Medicaid Managed Care Enrollment by Program and Plan (annual, data.medicaid.gov)
        run: npx tsx cms-intelligence/data/adapters/pull-medicaid-managed-care.ts

      - name: Pull SEC EDGAR 8-K filings (health-insurer watchlist)
        run: npx tsx cms-intelligence/data/adapters/pull-sec-edgar-filings.ts
      - name: Pull SEC EDGAR 8-K filings (every health-industry SIC code)
        run: npx tsx cms-intelligence/data/adapters/pull-sec-health-industry-8k.ts
      - name: Pull SEC Form D data sets (health-care private offerings, latest 8 quarters)
        run: npx tsx cms-intelligence/data/adapters/pull-sec-form-d.ts

      - name: Pull openFDA novel drug approvals
        run: npx tsx cms-intelligence/data/adapters/pull-fda-drug-approvals.ts

      - name: Pull NIH RePORTER award notices (top 100 + every award summarized, ~6 min at NIH's 1 request/second)
        run: npx tsx cms-intelligence/data/adapters/pull-nih-reporter-awards.ts

      - name: Pull ClinicalTrials.gov Phase 3 results postings
        run: npx tsx cms-intelligence/data/adapters/pull-clinicaltrials-results.ts

      - name: Pull CMS Physician Fee Schedule RVU files (latest release per year from 2013; only changed years download)
        run: npx tsx cms-intelligence/data/adapters/pull-physician-fee-schedule.ts

      - name: Pull CMS hospital penalty programs (HRRP, HAC Reduction, Hospital VBP, IPPS Tables 15 and 16B)
        run: npx tsx cms-intelligence/data/adapters/pull-hospital-penalty-programs.ts

      - name: Summarize CMS Provider of Services files (QIES and iQIES, new quarters only)
        # Past quarters are already committed; a new quarter takes about 10 seconds per file.
        run: npx tsx cms-intelligence/data/adapters/pull-provider-of-services.ts

      - name: Pull CMS hospital and SNF change of ownership and private equity owner files
        run: npx tsx cms-intelligence/data/adapters/pull-facility-ownership.ts

      - name: Check watched datasets for new data (flags only, never pulls)
        # A watch-list network failure must never block the data pull.
        continue-on-error: true
        run: npx tsx cms-intelligence/agents/source-change-monitor/check-watchlist.ts

      - name: Autonomous reasoning (skips at $0 if no source changed)
        # A model/API failure must never block committing the free data pull above.
        continue-on-error: true
        run: npx tsx cms-intelligence/reasoning/run-monthly-reasoning.ts
        env:
          # Repo secrets are named per-project; the code reads the standard variable names.
          ANTHROPIC_API_KEY: ${{ secrets.HEALTHCARE_INTEL_ANTH }}
          OPENAI_API_KEY: ${{ secrets.HEALTHCARE_INTEL_OAI }}
          SALIENCE_MODEL: ${{ vars.SALIENCE_MODEL }}
          ANALYST_MODEL: ${{ vars.ANALYST_MODEL }}

      - name: Commit updated snapshot and reasoned run
        run: |
          git config user.name "healthcare-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/healthcare-intelligence
          git diff --cached --quiet || git commit -m "chore: monthly healthcare-intelligence pull and reasoning $(date -u +%Y-%m-%d)"
          git push
